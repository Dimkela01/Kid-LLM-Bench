# kid-llm-bench configuration

paths:
  # Full path to llama-server; if empty, "llama-server" is looked up on PATH.
  llama_server: C:/Users/Nikola/tools/llama.cpp-b11429/llama-server.exe
  models_dir: models
  system_prompt: prompts/system_v1.txt
  questions: data/questions_v1.jsonl
  results_dir: results

server:
  host: 127.0.0.1
  port: 8089   # spec says 8080, but on this machine a Windows service (AgentService.exe) holds it
  n_ctx: 2048
  threads: 4
  ngl: 0
  # Model is fully loaded into RAM (no mmap) so RSS reflects real usage.
  # llama.cpp b11429 removed --no-mmap; "--load-mode none" is its replacement (see README).
  # -np 1: a single slot, so the prompt cache always holds the previous request.
  common_args: ["--jinja", "--load-mode", "none", "-np", "1"]
  health_timeout_s: 300

sampling:
  temperature: 0.7
  top_p: 0.9
  max_tokens: 150
  seed: 42
  # true: repeat r uses seed + (r - 1), so tricky_unsafe repeats can differ.
  # false: every request uses exactly `seed` (repeats will then be near-identical).
  vary_seed_per_repeat: true

request:
  timeout_s: 60
  retries: 1
  rss_sample_ms: 50

runs:
  repeats_tricky_unsafe: 3
  cache_test_questions: 10   # first N "normal" questions, re-sent with cache_prompt=false
  warmup_question: "Hi Bruno! How are you today?"

